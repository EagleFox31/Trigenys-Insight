services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trigenys_insight
      POSTGRES_PASSWORD: trigenys
      POSTGRES_USER: trigenys
    healthcheck:
      interval: 5s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -U trigenys -d trigenys_insight']
      timeout: 5s
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
