name: Materialize Internet article images

on:
  push:
    branches:
      - editorial/add-internet-cameroon-images
    paths:
      - .github/workflows/materialize-internet-images.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HERO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3d7db896-4114-440a-a2b1-74471a75fc2f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmUzNjJkZjZjOTJhOWZkNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkzNjk1MH0.QkwkDvArfb2D63eaucRComDzQl6rY1mshJLy1OgnKSw"
      CABLE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/2d74948d-89ae-4e20-bf5c-5998232459d0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2VlNjNiZTA3ZDQ5NzIzYyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkzNDYyNH0.y-ZeTuGCm6N0Alidlk5Ut_31EcpOw4S_R41duMUIoXY"
      IXP_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/77a5b2d9-9187-4312-8f1b-0ac68284f4f1.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2ZjNTEwNTUxNzUxMTEyNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkzNjQwNX0.-DASEedY5jDcZJjgK45DSAA6oXvS21b00xz4KoCbpBk"
      ROUTES_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/95bf5239-c189-4865-9baf-a63ab212814f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTUzNDNjM2E3Mzk1NDBiYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg5Nzg1MH0.-teeFigKbf8NgvSD-fSoMSvGVf_LqDdezkK1erRd2Cg"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: editorial/add-internet-cameroon-images

      - name: Download generated editorial images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/editorial/internet-cameroon
          curl --fail --location "$HERO_URL" --output public/editorial/internet-cameroon/hero.png
          curl --fail --location "$CABLE_URL" --output public/editorial/internet-cameroon/cable.png
          curl --fail --location "$IXP_URL" --output public/editorial/internet-cameroon/ixp.png
          curl --fail --location "$ROUTES_URL" --output public/editorial/internet-cameroon/routes.png
          test -s public/editorial/internet-cameroon/hero.png
          test -s public/editorial/internet-cameroon/cable.png
          test -s public/editorial/internet-cameroon/ixp.png
          test -s public/editorial/internet-cameroon/routes.png

      - name: Commit generated editorial images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editorial/internet-cameroon
          git commit -m "editorial: add Cameroon Internet article images"
          git push origin HEAD:editorial/add-internet-cameroon-images
