name: Check and package Trigenys Insight plugin
on:
  push:
    branches: [main]
    paths:
      - 'plugins/trigenys-insight/**'
      - 'packages/insight-automation/**'
      - 'scripts/plugins/**'
      - '.github/workflows/plugin-package.yml'
  pull_request:
    paths:
      - 'plugins/trigenys-insight/**'
      - 'packages/insight-automation/**'
      - 'scripts/plugins/**'
      - '.github/workflows/plugin-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build MCP definitions
        run: pnpm automation:build
      - name: Check the reviewed tool contract
        run: node scripts/plugins/export-tools.mjs
      - name: Build and inspect the package
        run: python3 scripts/plugins/package-plugin.py
      - name: Summarize readiness
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open('dist/plugin-submission/readiness-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Trigenys Insight plugin\n\n')
              summary.write('Package structure: valid.\n\n')
              summary.write('Ready for submission: ' + str(report['ready_for_submission']) + '\n\n')
              for item in report['missing']:
                  summary.write('- Pending: ' + item + '\n')
              summary.write('\nThis workflow does not refresh ChatGPT, request an OpenAI scan, submit for review or publish a plugin.\n')
          PY
      - name: Save review package and readiness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trigenys-insight-plugin-preparation
          path: dist/plugin-submission/
          if-no-files-found: error
          retention-days: 14
