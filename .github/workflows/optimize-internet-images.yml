name: Optimize Internet article images

on:
  push:
    branches:
      - editorial/add-internet-cameroon-images
    paths:
      - .github/workflows/optimize-internet-images.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: editorial/add-internet-cameroon-images

      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Convert PNG images to WebP
        shell: bash
        run: |
          set -euo pipefail
          dir="public/editorial/internet-cameroon"
          for name in hero cable ixp routes; do
            cwebp -quiet -q 78 -resize 1600 0 "$dir/$name.png" -o "$dir/$name.webp"
            test -s "$dir/$name.webp"
            rm "$dir/$name.png"
          done

      - name: Commit optimized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editorial/internet-cameroon
          git commit -m "editorial: optimize Cameroon Internet article images"
          git push origin HEAD:editorial/add-internet-cameroon-images
