name: Cloudflare compatibility

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
      - '.github/workflows/cloudflare-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        run: pnpm cloudflare:check

      - name: Generate Cloudflare config ephemerally
        run: pnpm dlx vinext init --platform=cloudflare --skip-check

      - name: Show vinext init changes
        run: |
          echo "===== package.json ====="
          git diff -- package.json
          echo "===== generated files ====="
          for file in vite.config.ts wrangler.jsonc; do
            if [ -f "$file" ]; then
              echo "----- $file -----"
              cat "$file"
            fi
          done
          echo "===== gitignore diff ====="
          git diff -- .gitignore
