name: Deploy Cloudflare pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SERVER_URL: https://trigenys-insight-cloudflare-pilot.lawrynnjennifer.workers.dev
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      DATABASE_URL: ${{ secrets.CLOUDFLARE_PILOT_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CLOUDFLARE_PILOT_DATABASE_URL_UNPOOLED }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: infra/cloudflare-pilot

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify required secrets
        shell: bash
        run: |
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN
            DATABASE_URL
            DATABASE_URL_UNPOOLED
            PAYLOAD_SECRET
            CRON_SECRET
            PREVIEW_SECRET
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret/environment: $name"
              missing=1
            fi
          done

          exit "$missing"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run compatibility gate
        run: pnpm cloudflare:check

      - name: Build Worker
        run: pnpm build:vinext

      - name: Prepare Worker secrets file
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const keys = [
            'DATABASE_URL',
            'DATABASE_URL_UNPOOLED',
            'PAYLOAD_SECRET',
            'CRON_SECRET',
            'PREVIEW_SECRET',
            'NEXT_PUBLIC_SERVER_URL',
            'NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN',
            'NEXT_PUBLIC_POSTHOG_HOST',
          ]

          const payload = Object.fromEntries(keys.map((key) => [key, process.env[key]]))
          fs.writeFileSync('/tmp/cloudflare-pilot-secrets.json', JSON.stringify(payload))
          NODE

      - name: Deploy isolated Worker
        run: |
          pnpm exec wrangler deploy \
            --config dist/server/wrangler.json \
            --name trigenys-insight-cloudflare-pilot \
            --secrets-file /tmp/cloudflare-pilot-secrets.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f /tmp/cloudflare-pilot-secrets.json

      - name: Print pilot URL
        run: echo "https://trigenys-insight-cloudflare-pilot.lawrynnjennifer.workers.dev"
