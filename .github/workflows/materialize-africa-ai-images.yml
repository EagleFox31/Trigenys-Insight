name: Materialize Africa AI article images

on:
  push:
    branches:
      - editorial/add-africa-ai-images
    paths:
      - .github/workflows/materialize-africa-ai-images.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HERO_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/113b74bb-4c23-46a7-8f49-59d76fb3de11.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjVkYWM4MzIzMzkyMTc1NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk1NjU5NH0.fGYPei41cO0svVbLGAQcsLwmhWUTuvL10f82wckhb1k"
      GOVERNANCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/38636300-90f0-4938-bf2d-a41570e9d951.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzQwNWYwM2IxN2Q1MjhlMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDkzOTgzNX0.7sQ5YFsGIRH5uZ17CRgu18F3vzYiDuDw-wsAzQBgIp0"
      COMPUTE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/24e1a0dc-d2b3-4f33-a878-757977f8a5bd.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzQ2NDZhN2Q5NmI0MTA4ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk1MDM5N30.pQL5XIl177rdgHrJcjfIrqta1BfGL4waDMYp29voTXA"
      INDUSTRY_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/8b6ad60d-ba0b-41e6-83ea-5721ce33ec22.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjlmYmNlZTc3Y2RjNTA0ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDg5NzM4M30.qqxcav1xnUvSalBMQtuFU_qeNXQ_Lq14l_uDX24dx7g"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: editorial/add-africa-ai-images

      - name: Install WebP encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Download and optimize generated editorial images
        shell: bash
        run: |
          set -euo pipefail
          dir="public/editorial/africa-ai-governance"
          mkdir -p "$dir"
          curl --fail --location "$HERO_URL" --output /tmp/hero.png
          curl --fail --location "$GOVERNANCE_URL" --output /tmp/governance.png
          curl --fail --location "$COMPUTE_URL" --output /tmp/compute.png
          curl --fail --location "$INDUSTRY_URL" --output /tmp/industry.png
          cwebp -quiet -q 78 -resize 1600 0 /tmp/hero.png -o "$dir/hero.webp"
          cwebp -quiet -q 78 -resize 1600 0 /tmp/governance.png -o "$dir/governance.webp"
          cwebp -quiet -q 78 -resize 1600 0 /tmp/compute.png -o "$dir/compute.webp"
          cwebp -quiet -q 78 -resize 1600 0 /tmp/industry.png -o "$dir/industry.webp"
          test -s "$dir/hero.webp"
          test -s "$dir/governance.webp"
          test -s "$dir/compute.webp"
          test -s "$dir/industry.webp"

      - name: Commit generated editorial images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/editorial/africa-ai-governance
          git commit -m "editorial: add Africa AI governance article images"
          git push origin HEAD:editorial/add-africa-ai-images
